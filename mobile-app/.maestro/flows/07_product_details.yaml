appId: com.sapprints.app
---
# 07. Product Details Screen Test (New Rebuilt Architecture)
# Verifies product hero showcase, ratings, paper stock options, finish coating,
# customization pathways, quantity tiers, specifications table, Add to Cart & Buy Now CTAs
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "Shop by Category"
    timeout: 5000

- tapOn: "Visiting Cards"
- tapOn: "Standard Visiting Cards"

# 1. Verify New Header & Image Showcase
- assertVisible: "Standard Visiting Cards"
- assertVisible: "2400 DPI Ultra HD Verified • Precision Die-Cut"

# 2. Verify Product Information & Pricing
- assertVisible: "In Stock"
- assertVisible: "Design & Customization"

# 3. Verify Design & Customization Pathways
- assertVisible: "Choose from 4,000+ Templates"
- assertVisible: "Open 3D Design Studio"
- assertVisible: "Upload Custom PDF / Artwork"

# 4. Verify Options & Variants
- scroll
- assertVisible: "Paper Stock & Weight"
- assertVisible: "350 GSM Art Card"
- assertVisible: "Surface Finish & Coating"
- assertVisible: "Silk Matte"
- assertVisible: "Corner Style & Printing Sides"

# 5. Verify Quantity Tiers
- scroll
- assertVisible: "Quantity & Bulk Discounts"
- assertVisible: "Save up to 25%"
- tapOn: "200"

# 6. Verify Delivery & Specifications
- scroll
- assertVisible: "Delivery & Turnaround"
- assertVisible: "Product Specifications"
- assertVisible: "Bleed & Safety"

# 7. Verify Fixed Bottom Purchase Bar
- assertVisible: "Add to Cart"
- assertVisible: "Buy Now"

# 8. Test Add to Cart Action
- tapOn: "Add to Cart"
- assertVisible: "Added to Cart"
- tapOn: "Continue Shopping"
