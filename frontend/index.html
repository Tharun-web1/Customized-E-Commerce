<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/asap-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@SAP PRINTS | Designing & Printing Services in Hyderabad</title>

    <link rel="canonical" href="https://asapnow.in/" />
    <meta property="og:url" content="https://asapnow.in/" />
    <meta property="og:title" content="@SAP PRINTS — Your Ideas, Our Prints" />
    <meta property="og:description" content="Professional printing services in Hyderabad including visiting cards, brochures, banners, posters, ID cards, custom printing and 3D printing." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-navy: #002c5f;
        --primary-blue: #0056b3;
        --accent-cyan: #0099ff;
        --accent-cyan-light: #e0f2fe;
        --vp-yellow: #ffb800;
        --vp-orange: #ea580c;
        --vp-green: #16a34a;
        
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --bg-subtle: #f1f5f9;
        --bg-dark: #091325;
        
        --text-main: #0f172a;
        --text-muted: #64748b;
        --text-subtle: #94a3b8;
        --text-inverse: #ffffff;
        
        --border-light: #e2e8f0;
        --border-focus: #0099ff;
        
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        --shadow-glow: 0 0 25px rgba(0, 153, 255, 0.25);
        
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-full: 9999px;
        
        --font-heading: 'Outfit', sans-serif;
        --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-body);
        color: var(--text-main);
        background-color: var(--bg-main);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        font-weight: 700;
        color: var(--primary-navy);
        line-height: 1.2;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        cursor: pointer;
        font-family: inherit;
        border: none;
        background: none;
        transition: all 0.2s ease;
      }
      .app-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
